# Integración continua: lint + tests del backend y lint + build del frontend.
# Se ejecuta en cada pull request y en cada push a main.

name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch: # permite lanzarla a mano desde la pestaña Actions

permissions:
  contents: read

# Si se sube un commit nuevo a un PR, se cancela la ejecución anterior (en main no).
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  backend:
    name: Backend (ruff + pytest)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:17
        env:
          POSTGRES_USER: reservas
          POSTGRES_PASSWORD: reservas
          POSTGRES_DB: reservas
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reservas"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # conftest.py deriva de aquí la base de pruebas "reservas_test" y la crea sola.
      DATABASE_URL: postgresql+psycopg://reservas:reservas@localhost:5432/reservas
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          # Rutas relativas a la raíz del repo (working-directory no les afecta).
          cache-dependency-path: |
            backend/requirements.txt
            backend/requirements-dev.txt
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: ruff format --check .
      - run: pytest

  frontend:
    name: Frontend (oxlint + build)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm run build # incluye la comprobación de tipos (tsc)
